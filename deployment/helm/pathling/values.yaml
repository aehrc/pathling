pathling:
  image: ghcr.io/aehrc/pathling:latest
  resources:
    requests:
      cpu: 2
      memory: 4G
    limits:
      memory: 4G
    maxHeapSize: 2800m
  additionalJavaOptions: -Duser.timezone=UTC
  deployment:
    strategy: Recreate
    imagePullPolicy: Always
    # The number of five-second startup probe failures tolerated before the container is
    # restarted. Raise this for the first start of a server that has to migrate a warehouse
    # written by an earlier version.
    startupProbeFailureThreshold: 36
  volumes: []
  volumeMounts: []
  serviceAccount: ~
  imagePullSecrets: []
  tolerations: []
  affinity: ~
  securityContext: ~
  # Configuration passed to the server as environment variables. Helm merges
  # user-supplied entries over these defaults, so each can be overridden, or
  # removed by setting it to null. The defaults require Spark's internal
  # connections to authenticate with a shared secret, and turn off the Spark
  # UI. When spark.master names a cluster manager, the chart also sets
  # spark.network.crypto.enabled to "true" unless it is set here. The chart
  # also reads spark.master, spark.ui.enabled and spark.kubernetes.namespace
  # from here to decide which Services and NetworkPolicy rules to create.
  config:
    spark.authenticate: "true"
    spark.ui.enabled: "false"
  secretConfig: {}
  # A NetworkPolicy that admits all clients to the FHIR API, executor pods to
  # the Spark driver ports, and only the listed peers to the management port
  # and the Spark UI. Each list holds NetworkPolicy "from" entries.
  networkPolicy:
    enabled: true
    managementFrom: []
    sparkUiFrom: []
  # Full JVM trust store (JKS or PKCS12) containing every CA that the server
  # and its Spark executors must trust, e.g. the base JDK cacerts merged with
  # any internal roots. Merging is out of scope: provide a complete store as a
  # Kubernetes Secret with a single data entry, never a list of PEM certs.
  #
  # The chart mounts this Secret read-only into the server pod and points that
  # JVM at it. Configuring executors to mount the same store is deliberately
  # left to the local Spark config (spark.kubernetes.executor.secrets.<name>
  # and spark.executorEnv.JAVA_TOOL_OPTIONS) - spark.* settings are out of the
  # chart's scope so they cannot stomp on custom configs. Create the Secret out
  # of band, e.g.:
  #   kubectl create secret generic pathling-truststore \
  #     --from-file=cacerts=/path/to/cacerts
  truststore:
    enabled: false
    # Name of the Kubernetes Secret holding the store, and the data key within
    # it that contains the store file itself.
    secretName: pathling-truststore
    key: cacerts
    # Trust store password and format (jks or pkcs12) used for
    # javax.net.ssl.trustStorePassword / trustStoreType.
    password: changeit
    type: jks
    mountPath: /truststore

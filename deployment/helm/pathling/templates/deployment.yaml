{{- $truststoreEnabled := gt (len .Values.pathling.trustedCertificates) 0 }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: pathling-deployment
spec:
  selector:
    matchLabels:
      app: pathling-server
  template:
    metadata:
      labels:
        app: pathling-server
    spec:
      {{- if $truststoreEnabled }}
      # The server verifies TLS connections (e.g. to the OIDC issuer) against
      # the JVM default truststore, which cannot be extended in place. This
      # init container copies the default cacerts from the server image and
      # imports each configured certificate, producing a merged truststore
      # that the server JVM is pointed at via javax.net.ssl.trustStore.
      initContainers:
        - name: merge-truststore
          image: {{ .Values.pathling.image | quote }}
          imagePullPolicy: {{ .Values.pathling.deployment.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              java_bin="$(readlink -f "$(command -v java)")"
              java_home="${java_bin%/bin/java}"
              cp "${java_home}/lib/security/cacerts" /truststore/cacerts
              chmod u+w /truststore/cacerts
              for certificate in /certificates/*.pem; do
                keytool -importcert -noprompt \
                  -keystore /truststore/cacerts -storepass changeit \
                  -alias "$(basename "${certificate}" .pem)" \
                  -file "${certificate}"
              done
          volumeMounts:
            - name: trusted-certificates
              mountPath: /certificates
              readOnly: true
            - name: truststore
              mountPath: /truststore
      {{- end }}
      containers:
        - name: pathling-server
          image: {{ .Values.pathling.image | quote }}
          imagePullPolicy: {{ .Values.pathling.deployment.imagePullPolicy }}
          ports:
            - containerPort: 8080
            - containerPort: 8081
            - containerPort: 4040
            - containerPort: 7077
            - containerPort: 7078
          resources:
            requests: {{ toJson .Values.pathling.resources.requests }}
            limits: {{ toJson .Values.pathling.resources.limits }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          {{- $volumeMounts := .Values.pathling.volumeMounts }}
          {{- if $truststoreEnabled }}
          {{- $volumeMounts = append $volumeMounts (dict "name" "truststore" "mountPath" "/truststore" "readOnly" true) }}
          {{- end }}
          volumeMounts: {{ toJson $volumeMounts }}
          {{- if gt (add (len .Values.pathling.config) (len .Values.pathling.secretConfig) (len .Values.pathling.trustedCertificates)) 0 }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: {{ printf "-Xmx%s  --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED %s%s" .Values.pathling.resources.maxHeapSize .Values.pathling.additionalJavaOptions (ternary " -Djavax.net.ssl.trustStore=/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit" "" $truststoreEnabled) }}
            - name: spark.driver.host
              value: pathling-driver
            - name: spark.driver.port
              value: "7077"
            - name: spark.blockManager.port
              value: "7078"
            - name: spark.driver.bindAddress
              value: 0.0.0.0
            # In client mode, Spark only sets an ownerReference on executor
            # pods when it knows the driver pod's name. This allows Kubernetes
            # garbage collection to remove executor pods (and their on-demand
            # PVCs) when the driver pod is deleted, e.g. on rollout restart.
            - name: spark.kubernetes.driver.pod.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- range $configKey, $configValue := .Values.pathling.config }}
            - name: {{ $configKey }}
              value: {{ $configValue | quote }}
            {{- end }}
            {{- range $configKey, $configValue := .Values.pathling.secretConfig }}
            - name: {{ $configKey }}
              valueFrom:
                secretKeyRef:
                  name: pathling-secrets
                  key: {{ $configKey }}
            {{- end }}
          {{- end }}
      {{- $volumes := .Values.pathling.volumes }}
      {{- if $truststoreEnabled }}
      {{- $volumes = append $volumes (dict "name" "trusted-certificates" "configMap" (dict "name" "pathling-trusted-certificates")) }}
      {{- $volumes = append $volumes (dict "name" "truststore" "emptyDir" (dict)) }}
      {{- end }}
      volumes: {{ toJson $volumes }}
      serviceAccountName: {{ .Values.pathling.serviceAccount }}
      imagePullSecrets: {{ toJson .Values.pathling.imagePullSecrets }}
      tolerations: {{ toJson .Values.pathling.tolerations }}
      affinity: {{ toJson .Values.pathling.affinity }}
      securityContext: {{ toJson .Values.pathling.securityContext }}
  strategy:
    type: {{ .Values.pathling.deployment.strategy }}
{{- if gt (len .Values.pathling.secretConfig) 0 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: pathling-secrets
data:
  {{- range $configKey, $configValue := .Values.pathling.secretConfig }}
  {{ $configKey }}: {{ $configValue | b64enc }}
  {{- end }}
{{- end }}

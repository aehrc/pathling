# Sets up Java with Maven caching and required environment variables.
#
# Author: John Grimes

name: Setup Java and Maven
description: Sets up Java and Maven with a restored Maven repository, SonarQube caching, and MAVEN_OPTS.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: "21"
  distribution:
    description: JDK distribution to use.
    required: false
    default: zulu
  # With Maven 3.10.0, central-publishing-maven-plugin leaves maven-metadata-local.xml at the
  # artifactId level of its bundle, and Central rejects the bundle as having content without a
  # POM. See https://github.com/mavenplugins/central-publishing-maven-plugin/issues/78.
  maven-version:
    description: Maven version to install.
    required: false
    default: "3.9.16"
  enable-sonar-cache:
    description: Enable SonarQube cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}

    # Maven is installed from the Apache archive rather than from Maven Central, which rate-limits
    # the download (HTTP 429) often enough to fail jobs. The distribution is cached, but a miss costs
    # only a download, so concurrent jobs racing to save it do no harm.
    - name: Cache Maven
      id: maven-dist
      uses: actions/cache@v4
      with:
        path: ~/.maven-dist/apache-maven-${{ inputs.maven-version }}
        key: ${{ runner.os }}-maven-dist-v2-${{ inputs.maven-version }}

    - name: Download Maven
      if: steps.maven-dist.outputs.cache-hit != 'true'
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.maven-version }}
      run: |
        set -euo pipefail
        name="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        path="maven/maven-3/${MAVEN_VERSION}/binaries/${name}"
        mkdir -p ~/.maven-dist
        cd ~/.maven-dist
        for base in https://dlcdn.apache.org https://archive.apache.org/dist; do
          if curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --output "${name}" "${base}/${path}"; then
            break
          fi
        done
        curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
          "https://archive.apache.org/dist/${path}.sha512" | awk '{print $1}' > "${name}.sha512"
        echo "$(cat "${name}.sha512")  ${name}" | sha512sum --check
        tar --extract --gzip --file "${name}"
        rm "${name}" "${name}.sha512"

    - name: Set up Maven
      shell: bash
      run: echo "${HOME}/.maven-dist/apache-maven-${{ inputs.maven-version }}/bin" >> "${GITHUB_PATH}"

    # The local repository is only restored here. It is saved by the Warm Maven cache workflow, from
    # a build that resolves everything the jobs need, because a job that saved its own repository
    # would freeze whatever subset it happened to download under a key that is then never saved
    # again. The cache is filled on the default branch so that every pull request can restore it.
    - name: Restore local Maven repository
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-repo-v2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |-
          ${{ runner.os }}-maven-repo-v2-${{ hashFiles('**/pom.xml') }}-
          ${{ runner.os }}-maven-repo-v2-

    - name: Cache SonarQube packages
      if: inputs.enable-sonar-cache == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    # The add-exports and add-opens flags are required for Java 21.
    - name: Set MAVEN_OPTS
      shell: bash
      run: echo "MAVEN_OPTS=--add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED" >> $GITHUB_ENV

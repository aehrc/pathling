# This workflow benchmarks the library API and publishes the results to the
# benchmarks page of the site.
#
# It is triggered manually, and benchmarks either the JARs of a previously
# successful build, given by its workflow run ID, or a release published to
# Maven Central, given by its version.

name: Benchmark

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID of a successful build"
        required: false
      version:
        description: "Released version to benchmark instead, e.g. 9.9.0"
        required: false
      publish:
        description: "Publish the results to the site"
        type: boolean
        default: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.get_commit.outputs.commit_sha }}
      short_sha: ${{ steps.get_commit.outputs.short_sha }}
      date: ${{ steps.run_benchmark.outputs.date }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Validate inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RUN_ID" && -n "$RELEASE_VERSION" ]] || [[ -z "$RUN_ID" && -z "$RELEASE_VERSION" ]]; then
            echo "::error::Specify either run_id or version"
            exit 1
          fi
          if [[ -n "$RELEASE_VERSION" && ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: must be in the form 1.2.3"
            exit 1
          fi

      - name: Get workflow run info
        id: get_run_info
        if: inputs.run_id != ''
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
        with:
          script: |
            const runId = parseInt(process.env.RUN_ID, 10);
            if (isNaN(runId) || runId <= 0) {
              core.setFailed('Invalid run_id: must be a positive integer');
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            core.setOutput('commit_sha', run.head_sha);
            core.setOutput('run_id', runId);

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.get_run_info.outputs.commit_sha || github.sha }}

      - name: Set up build environment
        uses: ./.github/actions/setup-build-tools
        with:
          java: "true"
          sonar-cache: "false"

      - name: Download JARs from specified run
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: jars
          run-id: ${{ steps.get_run_info.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: jars/

      - name: Get version
        id: get_version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            VERSION=$RELEASE_VERSION
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f utilities/pom.xml)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A release is benchmarked as the commit of its tag, while the benchmark
      # code comes from the commit that the workflow runs on.
      - name: Get benchmarked commit
        id: get_commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            COMMIT=$(git rev-parse "v${RELEASE_VERSION}^{commit}")
          else
            COMMIT=$(git rev-parse HEAD)
          fi
          echo "commit_sha=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short "$COMMIT")" >> "$GITHUB_OUTPUT"

      - name: Install artifacts
        if: inputs.run_id != ''
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # Install parent POM.
          mvn install:install-file \
            -Dfile=pom.xml \
            -DpomFile=pom.xml \
            -DgroupId=au.csiro.pathling \
            -DartifactId=pathling \
            -Dversion=$VERSION \
            -Dpackaging=pom

          # Install modules in dependency order.
          for MODULE in utilities encoders terminology fhirpath library-api library-runtime; do
            # Install main JAR.
            mvn install:install-file \
              -Dfile=jars/$MODULE/target/$MODULE-$VERSION.jar \
              -DpomFile=$MODULE/pom.xml \
              -DgroupId=au.csiro.pathling \
              -DartifactId=$MODULE \
              -Dversion=$VERSION \
              -Dpackaging=jar

            # Install sources JAR.
            mvn install:install-file \
              -Dfile=jars/$MODULE/target/$MODULE-$VERSION-sources.jar \
              -DpomFile=$MODULE/pom.xml \
              -DgroupId=au.csiro.pathling \
              -DartifactId=$MODULE \
              -Dversion=$VERSION \
              -Dpackaging=jar \
              -Dclassifier=sources
          done

      # For a release, the benchmark module takes its parent POM, and with it
      # the Spark version, from Maven Central. Only PathlingBenchmark is built,
      # as the other benchmarks use APIs that older releases do not have, and
      # the JOL version is supplied because older parent POMs do not define it.
      - name: Build benchmark JAR
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            find benchmark/src/main/java -name '*.java' ! -name 'PathlingBenchmark*.java' -delete
            rm -rf benchmark/src/test
            sed -i "0,/<version>[^<]*<\/version>/s//<version>${RELEASE_VERSION}<\/version>/" benchmark/pom.xml
            mvn --batch-mode package -f benchmark/pom.xml -DskipTests -Dpathling.jolVersion=0.17
          else
            mvn --batch-mode package -pl benchmark
          fi

      # TerminologyBenchmark is excluded, as it needs a terminology source that
      # is not available here. The module options are those that the Spark
      # launcher adds, which releases built on Spark 3.5 need on Java 21.
      - name: Run benchmark
        id: run_benchmark
        run: |
          OPENS=()
          for PACKAGE in java.lang java.lang.invoke java.lang.reflect java.io java.net \
            java.nio java.util java.util.concurrent java.util.concurrent.atomic sun.nio.ch \
            sun.nio.cs sun.security.action sun.util.calendar; do
            OPENS+=("--add-opens=java.base/$PACKAGE=ALL-UNNAMED")
          done
          java -Xshare:off -Xmx8g -ea -Duser.timezone=UTC \
            --add-exports=java.base/sun.nio.ch=ALL-UNNAMED "${OPENS[@]}" \
            -jar benchmark/target/benchmark-${{ steps.get_version.outputs.version }}.jar \
            -rf json -rff benchmark-${{ steps.get_commit.outputs.short_sha }}.json \
            PathlingBenchmark
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.get_commit.outputs.short_sha }}
          path: benchmark-*.json

  # Adds the results to the data served at /benchmarks/data on the site. The
  # site deployment preserves this directory, and shares the concurrency group
  # so that the two never write to gh-pages at the same time.
  publish:
    needs: benchmark
    if: inputs.publish
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up build environment
        uses: ./.github/actions/setup-build-tools
        with:
          java: "false"
          bun: "true"

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-${{ needs.benchmark.outputs.short_sha }}

      - name: Add results to benchmark data
        env:
          SHORT_SHA: ${{ needs.benchmark.outputs.short_sha }}
          COMMIT_SHA: ${{ needs.benchmark.outputs.commit_sha }}
          DATE: ${{ needs.benchmark.outputs.date }}
        run: |
          bun site/scripts/publishBenchmark.js \
            --results "benchmark-${SHORT_SHA}.json" \
            --data-dir gh-pages/benchmarks/data \
            --run-id "${{ github.run_id }}" \
            --commit "${COMMIT_SHA}" \
            --date "${DATE}"

      - name: Commit and push
        working-directory: gh-pages
        env:
          SHORT_SHA: ${{ needs.benchmark.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/data
          git commit -m "Publish benchmark results for ${SHORT_SHA}"
          git push

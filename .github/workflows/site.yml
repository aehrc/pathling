# This workflow deploys the documentation site to GitHub Pages.

name: Deploy site

# This workflow only runs on the main branch when site files change.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"

jobs:
  site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up build environment
        uses: ./.github/actions/setup-build-tools
        with:
          java: "true"
          spark: "true"
          r: "true"
          r-pandoc: "true"
          python: "true"
          bun: "true"

      - name: Run security scan
        uses: ./.github/actions/trivy-scan
        with:
          scan-ref: site
          trivyignore: site/.trivyignore
          skip-db-update: "true"

      - name: Run site tests
        working-directory: site
        run: bun test

      - name: Run install goal
        env:
          R_KEEP_PKG_SOURCE: yes
        run: |
          mvn --batch-mode install \
          -pl site -am -DskipTests -Pdocs
        timeout-minutes: 60

      - name: Copy R package into site
        run: |
          mkdir -p site/target/site/R
          cp lib/R/target/pathling_*.tar.gz site/target/site/R/

      - name: Save site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/target/site/
          # Keeps .nojekyll, which stops GitHub Pages ignoring underscore paths.
          include-hidden-files: true

  # Deployment is a separate, short job so that the gh-pages concurrency group,
  # which is shared with the benchmark workflow's publish job, is held only
  # while gh-pages is being written.
  deploy:
    name: Deploy site
    needs: site
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/target/site/

      - name: Preserve helm and benchmark data directories from gh-pages
        run: |
          git fetch --depth 1 origin gh-pages:gh-pages || true
          for DIR in helm benchmarks/data; do
            if git cat-file -e "gh-pages:${DIR}" 2>/dev/null; then
              git archive gh-pages "${DIR}" | tar -x -C site/target/site/
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/target/site
